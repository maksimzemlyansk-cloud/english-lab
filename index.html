<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111218">
  <meta name="description" content="Личная лаборатория американского английского">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <title>English Lab</title>
  <style>
    :root{color-scheme:dark;--bg:#111218;--panel:#191b24;--panel2:#20232e;--line:#303441;--text:#f2f3f7;--muted:#a5a9b7;--accent:#a9a0ff;--accent2:#5f55d9;--good:#73d6a2;--warn:#f0c779;--bad:#ff9292;font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -20%,#28254a 0,transparent 45%),var(--bg);color:var(--text);min-height:100vh}button,input,textarea{font:inherit}button{color:inherit;cursor:pointer}a{color:inherit}.shell{max-width:1100px;margin:auto;padding:20px 20px 100px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0 22px;border-bottom:1px solid var(--line)}.brand{font-weight:750;letter-spacing:.02em;font-size:19px}.brand span{color:var(--accent)}.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:5px 10px;border-radius:999px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;padding-top:24px}.side{display:flex;flex-direction:column;gap:8px}.navbtn{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 13px;border-radius:12px}.navbtn:hover,.navbtn.active{background:var(--panel2);color:var(--text)}main{min-width:0}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}.hero{padding:22px 0 10px}.hero h1{font-size:clamp(28px,5vw,42px);line-height:1.15;margin:8px 0 10px}.muted{color:var(--muted)}.card{background:linear-gradient(145deg,rgba(32,35,46,.97),rgba(24,26,34,.96));border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 16px 45px #0002}.card h2,.card h3{margin:0 0 10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{display:inline-flex;border:1px solid var(--line);padding:5px 10px;border-radius:999px;color:var(--muted);font-size:12px}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 17px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);text-decoration:none}.button.primary{background:var(--accent2);border-color:var(--accent2);font-weight:700}.button:disabled{opacity:.45;cursor:not-allowed}.button:hover:not(:disabled){filter:brightness(1.14)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stat{font-size:26px;font-weight:750}.section-title{margin:28px 0 10px;font-size:20px}.lesson-step{display:flex;gap:8px;align-items:center;margin-bottom:18px}.step-dot{height:8px;flex:1;border-radius:99px;background:#373a48}.step-dot.on{background:var(--accent)}.prompt{font-size:21px;font-weight:650;margin:8px 0 16px}.answer{width:100%;background:#101117;border:1px solid #424654;color:var(--text);padding:13px 14px;border-radius:12px;outline:none}.answer:focus{border-color:var(--accent);box-shadow:0 0 0 3px #a9a0ff33}textarea.answer{min-height:110px;resize:vertical}.feedback{border-radius:12px;padding:13px 15px;margin:14px 0;background:#2c273a;border:1px solid #514b68}.feedback.good{background:#182b25;border-color:#315d49}.feedback.bad{background:#302426;border-color:#674548}.rule{padding:12px 15px;background:#12141b;border-radius:12px;margin:9px 0;border-left:3px solid var(--accent)}.rule code{font-size:15px;color:#e6e1ff}.list{padding-left:20px}.empty{border:1px dashed #454957;border-radius:14px;padding:20px;color:var(--muted)}.formrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px}.inline{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.mobile-nav{display:none}.notice{font-size:13px;color:var(--muted);padding:10px 12px;background:#171922;border-radius:10px}.word{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.small{font-size:13px}.danger{color:var(--bad)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}@media(max-width:700px){.shell{padding:12px 14px 96px}.layout{display:block;padding-top:12px}.side{display:none}.hero{padding-top:18px}.card{padding:17px;margin:12px 0}.grid{grid-template-columns:1fr}.formrow{grid-template-columns:1fr}.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:2;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:#171820f5;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 5px max(7px,env(safe-area-inset-bottom))}.mobile-nav .navbtn{text-align:center;font-size:11px;padding:7px 3px}.mobile-nav .navbtn span{display:block;font-size:18px}.topbar{padding-bottom:14px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand">English <span>Lab</span></div><div class="badge">Локально · без аккаунта</div></header>
    <div class="layout">
      <nav class="side" aria-label="Основная навигация"></nav>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>
  <nav class="mobile-nav" aria-label="Основная навигация"></nav>
  <script>
  (()=>{
    const KEY='english-lab-free-v1';
    const GOOGLE_CLIENT_ID='REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID';
    const DRIVE_FILE_NAME='english-lab-progress.json';
    const DRIVE_ENABLED_KEY='english-lab-drive-enabled-v1';
    const initial={lessonStep:0,answers:[],practiceDraft:'',phrase:'',words:[],settings:{dailyMinutes:20}};
    let data;
    try{data={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data={...initial}}
    const app=document.querySelector('#app');
    let driveToken=null;let driveFileId=null;let driveSyncTimer=null;let driveBusy=false;
    const navItems=[['home','Главная','⌂'],['learn','Учиться','▤'],['vocabulary','Словарь','▧'],['progress','Прогресс','⌁'],['settings','Настройки','⚙']];
    let page='home';let checked=false;let lastResult=null;
    const save=()=>{data.lastUpdatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(data));if(driveToken&&localStorage.getItem(DRIVE_ENABLED_KEY)==='true'){clearTimeout(driveSyncTimer);driveSyncTimer=setTimeout(()=>uploadDriveData().catch(showDriveError),900)}};
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const nav=()=>{
      for(const host of [document.querySelector('.side'),document.querySelector('.mobile-nav')]){
        host.innerHTML=navItems.map(([id,label,icon])=>`<button class="navbtn ${page===id?'active':''}" data-page="${id}" ${id==='home'?`aria-label="Главная"`:''}><span aria-hidden="true">${icon}</span> ${label}</button>`).join('');
      }
    };
    function renderHome(){
      const stepsDone=Math.min(data.lessonStep,5);
      app.innerHTML=`<section class="hero"><div class="eyebrow">Американский английский · ваша программа</div><h1>Продолжаем с урока 4</h1><p class="muted">Один короткий шаг за раз. Ваш прогресс сохраняется в этом браузере на этом устройстве.</p></section>
       <section class="card"><div class="row"><div><div class="eyebrow">ТЕКУЩИЙ УРОК · 4</div><h2>Вопросы и отрицания</h2><div class="muted">Present Simple vs Present Continuous</div></div><span class="pill">${stepsDone}/5 шагов</span></div><div class="inline"><button class="button primary" data-action="continue">${stepsDone>=5?'Повторить урок':'Продолжить урок'}</button><span class="notice">Локальная копия · Google Диск опционально</span></div></section>
      <h2 class="section-title">План на сегодня</h2><section class="card"><ol class="list"><li>Урок 4 — шаг «${stepsDone>=5?'Итог':lessonStepNames[stepsDone]}».</li><li>Сделать одну собственную фразу.</li><li>Добавить незнакомые слова в свой словарь при желании.</li></ol></section>
      <h2 class="section-title">Другие разделы</h2><div class="grid"><section class="card"><h3>AI Tutor</h3><span class="pill">Позже</span><p class="muted small">ИИ не подключён; этот прототип не отправляет ваши ответы во внешние сервисы.</p></section><section class="card"><h3>Cinema Lab</h3><span class="pill">Позже</span><p class="muted small">Добавим разбор пользовательских субтитров отдельным этапом.</p></section></div><section class="card"><h3>Speaking Lab</h3><span class="pill">Позже</span><p class="muted small">Запись и распознавание речи здесь не используются.</p></section>`;
    }
    const lessonStepNames=['Повторение','Короткое объяснение','Практика','Своя фраза','Итог'];
    function classifyAnswer(raw,expected){
      const norm=s=>s.toLowerCase().trim().replace(/[.!?]+$/,'').replace(/\s+/g,' ');
      const answer=norm(raw);const correct=expected.some(x=>norm(x)===answer);
      if(correct)return{correct:true,category:'Верно',text:'Отлично. Форма и порядок слов подходят.'};
      if(/\b(does|do|am|is|are|don't|doesn't|isn't|aren't|not)\b/.test(answer)&&/\b(work|works|working|watch|watches|watching|play|plays|playing)\b/.test(answer)){
        if(/\b(does|doesn't)\s+\w+\s+\w+s\b/.test(answer)||/\b(do|does)\s+\w+\s+(am|is|are)\b/.test(answer))return{correct:false,category:'Форма глагола',text:'После do/does или doesn’t нужен глагол без окончания -s. Проверь основную форму глагола.'};
        if(/^\w+\s+(do|does|am|is|are)\b/.test(answer))return{correct:false,category:'Порядок слов',text:'В вопросе вспомогательный глагол обычно стоит перед подлежащим.'};
      }
      return{correct:false,category:'Проверь вспомогательный глагол и форму глагола',text:'Сначала выбери do/does для обычного действия или am/is/are + -ing для действия сейчас. Затем проверь форму основного глагола.'};
    }
    function renderLesson(){
      if(data.lessonStep>=5)data.lessonStep=4;
      const step=data.lessonStep;checked=step===0?false:checked;
      const dots=lessonStepNames.map((_,i)=>`<div class="step-dot ${i<=step?'on':''}"></div>`).join('');
      let body='';
      if(step===0){body=`<p class="muted">Коротко вспомним: какое начало подходит для вопроса о действии, которое происходит сейчас?</p><div class="prompt">___ you watching a video now?</div><div class="grid"><button class="button" data-answer="Do">Do</button><button class="button" data-answer="Are">Are</button><button class="button" data-answer="Does">Does</button><button class="button" data-answer="Is">Is</button></div>${lastResult?feedback(lastResult):''}${lastResult?'<div class="inline"><button class="button primary" data-action="next">Дальше</button></div>':''}`}
      if(step===1){body=`<p>В Present Simple для вопросов и отрицаний используем <strong>do/does</strong>. После них основной глагол остаётся в базовой форме.</p><div class="rule"><code>Do/Does + subject + base verb?</code></div><div class="rule"><code>Subject + don't/doesn't + base verb.</code></div><p>Для действия, происходящего сейчас, ставим <strong>am/is/are</strong> перед подлежащим в вопросе или после него в отрицании, а основной глагол заканчиваем на <strong>-ing</strong>.</p><div class="rule"><code>Am/Is/Are + subject + verb-ing?</code></div><div class="rule"><code>Subject + am/is/are + not + verb-ing.</code></div><p class="muted small">Не добавляй -s к глаголу после do/does или don't/doesn't.</p>`}
      if(step===2){body=`<p class="muted">Впиши пропущенные слова. Сначала попробуй сам — ответ пока скрыт.</p><div class="prompt">He ___ (not / work) on Saturdays.</div><label class="small" for="practice">Твой ответ</label><input class="answer" id="practice" autocomplete="off" value="${esc(data.practiceDraft||'')}" placeholder="Полная отрицательная фраза">${lastResult?feedback(lastResult):''}<div class="inline"><button class="button primary" data-action="check">Проверить</button></div>`}
      if(step===3){body=`<p class="muted">Составь один вопрос или отрицание про свою обычную жизнь или то, что происходит сейчас.</p><div class="rule"><code>Do/Does + subject + base verb?</code><br><code>Subject + don't/doesn't + base verb.</code><br><code>Am/Is/Are + subject + verb-ing?</code><br><code>Subject + am/is/are + not + verb-ing.</code></div><label class="small" for="phrase">Твоя фраза на английском</label><textarea class="answer" id="phrase" placeholder="Например: I don't drink coffee at night.">${esc(data.phrase)}</textarea><p class="muted small">Фраза сохранится локально. Автоматической проверки нет.</p>`}
      if(step===4){const answers=data.answers.length;body=`<div class="feedback good"><strong>Шаг завершён.</strong><br>Ты сделал попытки и сохранил свою фразу. Это ещё не оценка освоения темы.</div><p>Повтори контраст:</p><ul class="list"><li>обычное действие: do/does + базовая форма;</li><li>действие сейчас: am/is/are + глагол с -ing.</li></ul><p class="muted">Попыток в этом занятии: ${answers}. Текущая позиция — урок 4.</p><div class="notice">Следующий шаг — вернуться к этим формам в разговорной фразе на следующем занятии. Новые времена пока не добавляем.</div>`}
      app.innerHTML=`<div class="row"><div><div class="eyebrow">УРОК 4</div><h1 class="section-title">Present Simple и Present Continuous</h1></div><span class="pill">${step+1} из 5</span></div><div class="lesson-step">${dots}</div><div class="card"><div class="eyebrow">${lessonStepNames[step]}</div>${body}<div class="inline">${step>0?'<button class="button" data-action="back">Назад</button>':''}${step>0&&step<4?'<button class="button primary" data-action="next">Дальше</button>':''}${step===3?'<button class="button primary" data-action="save-phrase">Сохранить фразу</button>':''}${step===4?'<button class="button" data-action="home">На главную</button>':''}</div></div><div class="notice">Локальная копия сохраняется всегда · облачная синхронизация включается в настройках</div>`;
    }
    function feedback(result){return `<div class="feedback ${result.correct?'good':'bad'}"><strong>${esc(result.category)}</strong><br>${esc(result.text)}</div>`}
    function setDriveStatus(message){const status=document.querySelector('#drive-status');if(status)status.textContent=message}
    function showDriveError(error){console.error(error);setDriveStatus(`Синхронизация не удалась: ${error.message||'проверь подключение и повтори попытку.'}`)}
    function requestDriveToken(silent=false){return new Promise((resolve,reject)=>{if(!window.google?.accounts?.oauth2){reject(new Error('Не загрузился сервис входа Google. Проверь интернет и попробуй снова.'));return}const client=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',callback:response=>{if(response.error){reject(new Error(response.error_description||response.error));return}driveToken=response.access_token;resolve(driveToken)}});client.requestAccessToken(silent?{prompt:''}:{})})}
    async function driveRequest(url,options={}){const response=await fetch(url,{...options,headers:{Authorization:`Bearer ${driveToken}`,...options.headers}});if(!response.ok){const detail=await response.text();throw new Error(`Google Drive (${response.status}): ${detail.slice(0,180)}`)}return response}
    async function findDriveFile(){const q=encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);const response=await driveRequest(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`);const result=await response.json();driveFileId=result.files?.[0]?.id||null;if(driveFileId)localStorage.setItem('english-lab-drive-file-v1',driveFileId);return driveFileId}
    async function readDriveData(){if(!driveFileId)return null;const response=await driveRequest(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(driveFileId)}?alt=media`);return await response.json()}
    async function uploadDriveData(){if(driveBusy||!localStorage.getItem(DRIVE_ENABLED_KEY))return;driveBusy=true;try{if(!driveToken)await requestDriveToken(true);if(!driveFileId)await findDriveFile();const payload=JSON.stringify({version:1,updatedAt:data.lastUpdatedAt||new Date().toISOString(),data});if(driveFileId){await driveRequest(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(driveFileId)}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:payload})}else{const metadata={name:DRIVE_FILE_NAME,mimeType:'application/json'};const boundary='englishlab_'+Date.now();const body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${payload}\r\n--${boundary}--`;const response=await driveRequest('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':`multipart/related; boundary=${boundary}`},body});const created=await response.json();driveFileId=created.id;localStorage.setItem('english-lab-drive-file-v1',driveFileId)}setDriveStatus(`Синхронизировано · ${new Date().toLocaleTimeString()}`)}finally{driveBusy=false}}
    async function connectDrive(){try{setDriveStatus('Подключаю Google Диск…');await requestDriveToken();if(!driveFileId)await findDriveFile();if(driveFileId){const remote=await readDriveData();const useCloud=window.confirm('На Google Диске уже есть данные English Lab. Нажми OK, чтобы загрузить их на это устройство; нажми Отмена, чтобы сохранить данные этого устройства в облако.');if(useCloud&&remote?.data){data={...initial,...remote.data};localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(DRIVE_ENABLED_KEY,'true');renderSettings();setDriveStatus('Данные восстановлены из Google Диска.');return}}localStorage.setItem(DRIVE_ENABLED_KEY,'true');await uploadDriveData();renderSettings();setDriveStatus('Синхронизация включена. Изменения будут сохраняться в Google Диск автоматически.')}catch(error){showDriveError(error)}}
    async function syncFromDrive(){if(GOOGLE_CLIENT_ID==='REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID'||localStorage.getItem(DRIVE_ENABLED_KEY)!=='true')return;try{await requestDriveToken(true);if(!driveFileId)await findDriveFile();if(!driveFileId){await uploadDriveData();return}const remote=await readDriveData();if(!remote?.data)return;const remoteTime=Date.parse(remote.updatedAt||'')||0;const localTime=Date.parse(data.lastUpdatedAt||'')||0;if(remoteTime>localTime){data={...initial,...remote.data};localStorage.setItem(KEY,JSON.stringify(data));if(page==='settings')renderSettings();setDriveStatus('Облачный прогресс загружен.')}else if(localTime>remoteTime){await uploadDriveData()}else{setDriveStatus('Google Диск синхронизирован.')}}catch(error){setDriveStatus('Для автоматической синхронизации нажми «Подключить / синхронизировать».')}}
    function renderVocabulary(){app.innerHTML=`<section class="hero"><div class="eyebrow">Личный словарь</div><h1>Vocabulary</h1><p class="muted">Записи хранятся локально и синхронизируются, если подключён Google Диск.</p></section><section class="card"><h2>Добавить слово или выражение</h2><div class="formrow"><input id="word-en" class="answer" placeholder="Английское слово"><input id="word-ru" class="answer" placeholder="Перевод или смысл"><button class="button primary" data-action="add-word">Добавить</button></div></section><section class="card">${data.words.length?data.words.map((w,i)=>`<div class="word"><div><strong>${esc(w.en)}</strong><div class="muted">${esc(w.ru)}</div></div><button class="button small" data-action="delete-word" data-index="${i}" aria-label="Удалить ${esc(w.en)}">Удалить</button></div>`).join(''):'<div class="empty">Словарь пока пуст. Добавь сюда слова, которые хочешь повторить.</div>'}</section>`}
    function renderProgress(){const attempts=data.answers.length;const savedPhrases=data.phrase?1:0;app.innerHTML=`<section class="hero"><div class="eyebrow">Ваша история занятий</div><h1>Прогресс</h1><p class="muted">Показываем только то, что приложение действительно сохранило.</p></section><div class="grid"><section class="card"><div class="muted small">Текущий урок</div><div class="stat">4</div><div class="muted">изучаемая тема</div></section><section class="card"><div class="muted small">Сохранённые попытки</div><div class="stat">${attempts}</div><div class="muted">локально в этом браузере</div></section><section class="card"><div class="muted small">Свои фразы</div><div class="stat">${savedPhrases}</div><div class="muted">сохранено вручную</div></section><section class="card"><div class="muted small">Уровень CEFR</div><div class="stat">—</div><div class="muted">официальная оценка не проводилась</div></section></div><section class="card"><h2>История урока 4</h2>${attempts?`<p>Сохранено попыток: ${attempts}. Верные ответы не считаются доказательством освоения темы.</p>`:'<div class="empty">Здесь появится число сохранённых учебных попыток. Данных пока нет.</div>'}</section>`}
    function renderSettings(){const configured=GOOGLE_CLIENT_ID!=='REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID';const enabled=localStorage.getItem(DRIVE_ENABLED_KEY)==='true';app.innerHTML=`<section class="hero"><div class="eyebrow">Настройки</div><h1>Данные и хранение</h1><p class="muted">Ваш прогресс хранится на устройстве. По желанию можно включить синхронизацию через Google Диск.</p></section><section class="card"><h2>Синхронизация с Google Диском</h2><p>Приложение создаст один файл <code>${DRIVE_FILE_NAME}</code> и будет обращаться только к файлам, созданным или выбранным для English Lab. Остальные файлы Диска недоступны.</p><button class="button primary" data-action="drive-connect" ${configured?'':'disabled'}>${enabled?'Подключить / синхронизировать':'Подключить Google Диск'}</button><p id="drive-status" class="muted small" aria-live="polite">${configured?(enabled?'Синхронизация включена для этого браузера.':'Синхронизация пока выключена.'):'Подключение включим после настройки OAuth.'}</p><p id="settings-message" class="muted small" aria-live="polite"></p></section><section class="card"><h2>Резервная копия</h2><div class="inline"><button class="button" data-action="export">Скачать резервную копию</button><label class="button" for="import-file">Восстановить из копии</label><input hidden id="import-file" type="file" accept="application/json"></div></section><section class="card"><h2>Лимиты и приватность</h2><ul class="list"><li>Платных API и ИИ-вызовов нет.</li><li>Учебные данные хранятся в вашем Google Диске, когда вы включите синхронизацию.</li><li>Разрешение Google ограничено файлами приложения, не всем Диском.</li><li>Для входа Google и первоначального согласия потребуется интернет.</li></ul></section><section class="card"><h2>Занятие</h2><label for="minutes">Желаемая длительность: <strong id="minutes-value">${data.settings.dailyMinutes}</strong> минут</label><input id="minutes" type="range" min="5" max="40" step="5" value="${data.settings.dailyMinutes}" style="width:100%;margin-top:16px"></section>`}
    function render(){nav();({home:renderHome,learn:renderLesson,vocabulary:renderVocabulary,progress:renderProgress,settings:renderSettings}[page]());document.querySelector('.badge').textContent=localStorage.getItem(DRIVE_ENABLED_KEY)==='true'?'Google Диск · синхронизация':'Локально · без аккаунта'}
    function move(step){data.lessonStep=Math.max(0,Math.min(4,step));save();lastResult=null;checked=false;render()}
    function feedbackAttempt(raw,expected){const result=classifyAnswer(raw,expected);lastResult=result;data.answers.push({step:data.lessonStep,answer:raw,correct:result.correct,category:result.category,at:new Date().toISOString()});save();renderLesson()}
    document.addEventListener('click',e=>{
      const pageBtn=e.target.closest('[data-page]');if(pageBtn){page=pageBtn.dataset.page;lastResult=null;render();app.focus();return}
      const action=e.target.closest('[data-action]');if(action){const a=action.dataset.action;
        if(a==='continue'){page='learn';if(data.lessonStep>=5)data.lessonStep=4;render()}
        if(a==='home'){page='home';render()}
        if(a==='next')move(data.lessonStep+1)
        if(a==='back')move(data.lessonStep-1)
        if(a==='check'){const input=document.querySelector('#practice');const answer=input.value.trim();if(!answer){input.focus();return}feedbackAttempt(answer,["doesn't work","does not work","doesnt work"])}
        if(a==='save-phrase'){const input=document.querySelector('#phrase');data.phrase=input.value.trim();if(!data.phrase){input.focus();return}save();move(4)}
        if(a==='add-word'){const en=document.querySelector('#word-en').value.trim(),ru=document.querySelector('#word-ru').value.trim();if(!en||!ru)return;data.words.unshift({en,ru});save();renderVocabulary()}
        if(a==='delete-word'){data.words.splice(Number(action.dataset.index),1);save();renderVocabulary()}
        if(a==='export')exportData()
        if(a==='drive-connect')connectDrive()
      }
      const answer=e.target.closest('[data-answer]');if(answer&&data.lessonStep===0){feedbackAttempt(answer.dataset.answer,['Are'])}
    });
    document.addEventListener('input',e=>{if(e.target.id==='minutes'){data.settings.dailyMinutes=Number(e.target.value);document.querySelector('#minutes-value').textContent=e.target.value;save()}if(e.target.id==='phrase'){data.phrase=e.target.value;save()}if(e.target.id==='practice'){data.practiceDraft=e.target.value;save()}});
    function exportData(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='english-lab-backup.json';link.click();URL.revokeObjectURL(url)}
    document.addEventListener('change',async e=>{if(e.target.id==='import-file'){const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(parsed.version!==1||!parsed.data)throw new Error('Формат копии не распознан');data={...initial,...parsed.data};save();document.querySelector('#settings-message').textContent='Копия восстановлена на этом устройстве.';renderSettings()}catch{document.querySelector('#settings-message').textContent='Не удалось прочитать файл копии.'}}});
    render();
    setTimeout(syncFromDrive,1800);
    if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
  })();
  </script>
</body>
</html>
